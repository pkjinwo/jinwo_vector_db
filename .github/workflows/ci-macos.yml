name: CI-macOS

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install cmake ninja

    - name: Configure with CMake
      run: |
        mkdir -p build
        cd build
        cmake .. -DJW_BUILD_SHARED=ON -DJW_BUILD_STATIC=ON -DJW_BUILD_TESTS=ON -DJW_BUILD_EXAMPLES=ON

    - name: Build
      run: |
        cd build
        make -j$(sysctl -n hw.ncpu)

    - name: Build with Ninja
      run: |
        rm -rf build
        mkdir -p build
        cd build
        cmake .. -G Ninja -DJW_BUILD_SHARED=ON -DJW_BUILD_STATIC=ON -DJW_BUILD_TESTS=ON
        ninja

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Build with SIMD enabled
      run: |
        rm -rf build
        mkdir -p build
        cd build
        cmake .. -DJW_BUILD_SHARED=ON -DJW_BUILD_TESTS=ON -DJW_ENABLE_SIMD=ON
        make -j$(sysctl -n hw.ncpu)

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: |
          build/libjwvecdb.*
          build/tests/test_*

  homebrew:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install cmake

    - name: Configure
      run: |
        mkdir -p build
        cd build
        cmake .. -DJW_BUILD_SHARED=ON -DJW_BUILD_TESTS=ON

    - name: Build
      run: |
        cd build
        make

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

  universal-binary:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install cmake

    - name: Configure for universal binary
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DJW_BUILD_SHARED=ON -DJW_BUILD_TESTS=ON

    - name: Build universal binary
      run: |
        cd build
        make -j$(sysctl -n hw.ncpu)

    - name: Verify architecture
      run: |
        cd build
        lipo -info libjwvecdb.*
