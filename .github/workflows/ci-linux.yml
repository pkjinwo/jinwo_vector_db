name: CI-Linux

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build_x86:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build & test Linux x86_64 wheels
      uses: pypa/cibuildwheel@v2.21.3
      env:
        CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
        CIBW_SKIP: "*-musllinux*"
        CIBW_ARCHS_LINUX: "x86_64"
        CIBW_TEST_COMMAND: "python {project}/test_jinwo_vecdb.py"
      with:
        package-dir: build_python_pypi

    - name: Upload x86_64 wheel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-wheels-x86_64
        path: ./wheelhouse/*

  build_arm:
    # 使用 GitHub 原生 ARM64 运行器，避免 QEMU 模拟导致的编译超时
    # 原 x86_64+QEMU 方式编译 5 个 Python 版本需 6+ 小时
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build & test Linux aarch64 wheels
      uses: pypa/cibuildwheel@v2.21.3
      env:
        CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
        CIBW_SKIP: "*-musllinux*"
        CIBW_ARCHS_LINUX: "aarch64"
        CIBW_TEST_COMMAND: "python {project}/test_jinwo_vecdb.py"
      with:
        package-dir: build_python_pypi

    - name: Upload aarch64 wheel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-wheels-aarch64
        path: ./wheelhouse/*
