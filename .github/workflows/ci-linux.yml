name: CI-Linux

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake ninja-build

    - name: Configure with CMake
      run: |
        mkdir -p build
        cd build
        cmake .. -DJW_BUILD_SHARED=ON -DJW_BUILD_STATIC=ON -DJW_BUILD_TESTS=ON -DJW_BUILD_EXAMPLES=ON

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Build with Ninja
      run: |
        rm -rf build
        mkdir -p build
        cd build
        cmake .. -G Ninja -DJW_BUILD_SHARED=ON -DJW_BUILD_STATIC=ON -DJW_BUILD_TESTS=ON
        ninja

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Build with SIMD enabled
      run: |
        rm -rf build
        mkdir -p build
        cd build
        cmake .. -DJW_BUILD_SHARED=ON -DJW_BUILD_TESTS=ON -DJW_ENABLE_SIMD=ON
        make -j$(nproc)

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: |
          build/libjwvecdb.so
          build/libjwvecdb.a
          build/tests/test_*

  sanitizers:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Build with AddressSanitizer
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_C_FLAGS="-fsanitize=address -g -O1" -DJW_BUILD_TESTS=ON
        make -j$(nproc)

    - name: Run tests with sanitizers
      run: |
        cd build
        ctest --output-on-failure || true
        ASAN_OPTIONS=detect_leaks=1 ctest --output-on-failure

  coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake lcov

    - name: Configure with coverage
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_C_FLAGS="--coverage" -DJW_BUILD_TESTS=ON

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

    - name: Generate coverage report
      run: |
        cd build
        lcov --capture --directory . --output-file coverage.info
        lcov --remove coverage.info '/usr/*' --output-file coverage.filtered.info
        lcov --list coverage.filtered.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./build/coverage.filtered.info
        flags: unittests
