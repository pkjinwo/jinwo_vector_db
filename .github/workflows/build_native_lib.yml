name: Build Native Lib (libjinwo)

# 跨平台底座：把纯 C 核心编译成 libjinwo 共享库，供所有语言（含未发布的 C#/PHP 等）
# 通过 FFI / DllImport 复用。全项目统一库名 libjinwo（不允许第二套名字；历史上的
# libjinwo_vecdb 已废弃）。
# 流程：用根 CMakeLists.txt 编译出 libjinwo.*，再按平台重命名为 libjinwo-<平台>.*。
#   Linux   -> libjinwo-linux-<arch>.so
#   macOS   -> libjinwo-darwin-<arch>.dylib (另附 universal)
#   Windows -> libjinwo-windows-x86_64.dll (+ 导入库 .lib)
# 每个产物附带 include/*.h 头文件，供 PHP(FFI) / C#(DllImport) 复用。
# 触发：push / PR / 手动 / release（release 时同时挂到 Release 资源）。
#
# ⚠️ 全项目统一库名 libjinwo。

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target jinwo -j4
      - name: Package (lib + headers)
        run: |
          mkdir -p pkg/lib pkg/include
          cp build/libjinwo.so pkg/lib/libjinwo-linux-x86_64.so
          cp -r include/* pkg/include/
          tar -C pkg -czf libjinwo-linux-x86_64.tar.gz .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libjinwo-linux-x86_64
          path: libjinwo-linux-x86_64.tar.gz
      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: libjinwo-linux-x86_64.tar.gz

  linux-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Configure & build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target jinwo -j4
      - name: Package (lib + headers)
        run: |
          mkdir -p pkg/lib pkg/include
          cp build/libjinwo.so pkg/lib/libjinwo-linux-aarch64.so
          cp -r include/* pkg/include/
          tar -C pkg -czf libjinwo-linux-aarch64.tar.gz .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libjinwo-linux-aarch64
          path: libjinwo-linux-aarch64.tar.gz
      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: libjinwo-linux-aarch64.tar.gz

  macos:
    name: macOS (x86_64 + arm64 + universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build x86_64
        run: |
          cmake -S . -B build_x86 -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build_x86 --target jinwo -j4
      - name: Build arm64
        run: |
          cmake -S . -B build_arm -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build_arm --target jinwo -j4
      - name: Lipo universal + package
        run: |
          lipo -create build_x86/libjinwo.dylib build_arm/libjinwo.dylib -output libjinwo.dylib
          mkdir -p pkg/lib pkg/include
          cp libjinwo.dylib            pkg/lib/libjinwo-darwin-universal.dylib
          cp build_x86/libjinwo.dylib  pkg/lib/libjinwo-darwin-x86_64.dylib
          cp build_arm/libjinwo.dylib  pkg/lib/libjinwo-darwin-arm64.dylib
          cp -r include/* pkg/include/
          tar -C pkg -czf libjinwo-darwin-universal.tar.gz .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libjinwo-darwin-universal
          path: libjinwo-darwin-universal.tar.gz
      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: libjinwo-darwin-universal.tar.gz

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target jinwo --config Release -j4
      - name: Package (dll + import lib + headers)
        shell: bash
        run: |
          mkdir -p pkg/lib pkg/include
          cp build/Release/libjinwo.dll pkg/lib/libjinwo-windows-x86_64.dll
          cp build/Release/libjinwo.lib pkg/lib/libjinwo-windows-x86_64.lib
          cp -r include/* pkg/include/
          tar -C pkg -czf libjinwo-windows-x86_64.tar.gz .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libjinwo-windows-x86_64
          path: libjinwo-windows-x86_64.tar.gz
      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: libjinwo-windows-x86_64.tar.gz
