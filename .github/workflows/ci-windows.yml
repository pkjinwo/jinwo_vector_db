name: CI-Windows

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure with CMake (Visual Studio)
      run: |
        mkdir build
        cd build
        cmake .. -G "Visual Studio 17 2022" -DJW_BUILD_SHARED=ON -DJW_BUILD_STATIC=ON -DJW_BUILD_TESTS=ON -DJW_BUILD_EXAMPLES=ON

    - name: Build
      run: |
        cd build
        cmake --build . --config Release

    - name: Build Debug
      run: |
        cd build
        cmake --build . --config Debug

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure -C Release

  ninja:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Ninja
      run: |
        choco install ninja

    - name: Configure with CMake and Ninja
      run: |
        mkdir build
        cd build
        cmake .. -G Ninja -DJW_BUILD_SHARED=ON -DJW_BUILD_STATIC=ON -DJW_BUILD_TESTS=ON

    - name: Build
      run: |
        cd build
        ninja

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure

  msys2-mingw:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: >
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-toolchain

    - name: Configure with CMake (MinGW)
      shell: msys2 {0}
      run: |
        mkdir -p build
        cd build
        cmake .. -G Ninja -DJW_BUILD_SHARED=ON -DJW_BUILD_STATIC=ON -DJW_BUILD_TESTS=ON
        ninja

    - name: Run tests
      shell: msys2 {0}
      run: |
        cd build
        ctest --output-on-failure

  cross-compile:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install MinGW-w64
      run: |
        choco install mingw

    - name: Configure for ARM64 cross-compilation
      run: |
        mkdir build
        cd build
        cmake .. -G "MinGW Makefiles" -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DJW_BUILD_SHARED=OFF -DJW_BUILD_TESTS=ON

    - name: Build
      run: |
        cd build
        mingw32-make

  sanitizers:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install MSYS2
      run: |
        choco install msys2

    - name: Install dependencies
      shell: bash
      run: |
        pacman -S --noconfirm mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake

    - name: Build with sanitizers
      shell: bash
      run: |
        mkdir -p build
        cd build
        CFLAGS="-fsanitize=address -g -O1" LDFLAGS="-fsanitize=address" cmake .. -G Ninja -DJW_BUILD_TESTS=ON
        ninja

    - name: Run tests with sanitizers
      shell: bash
      run: |
        cd build
        ctest --output-on-failure || true
