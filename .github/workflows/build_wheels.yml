name: Build Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_linux:
    name: Build Linux wheels
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_BEFORE_BUILD_LINUX: pip install cmake && cd build_python_pypi/jinwo_vecdb/py_jinwo && mkdir -p build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Release && cmake --build . --config Release -- -j$(nproc)
        with:
          package-dir: build_python_pypi

      - name: Build source distribution
        if: github.event_name == 'release'
        run: |
          python -m pip install build
          python -m build --sdist --paths build_python_pypi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: ./wheelhouse/*

  build_macos:
    name: Build macOS wheels
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_BEFORE_BUILD_MACOS: pip install cmake && cd build_python_pypi/jinwo_vecdb/py_jinwo && mkdir -p build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Release && cmake --build . --config Release -- -j4
        with:
          package-dir: build_python_pypi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: ./wheelhouse/*

  build_windows:
    name: Build Windows wheels
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_BEFORE_BUILD_WINDOWS: pip install cmake && cd build_python_pypi/jinwo_vecdb/py_jinwo && mkdir build && cd build && cmake .. -G "Visual Studio 17 2022" -A x64 && cmake --build . --config Release
        with:
          package-dir: build_python_pypi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: ./wheelhouse/*

  publish:
    name: Publish to PyPI
    needs: [build_linux, build_macos, build_windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "dist-*"
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
