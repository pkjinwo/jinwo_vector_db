name: Build Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_linux_x86_64:
    name: Build Linux x86_64 wheels
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build & test Linux x86_64 wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_TEST_COMMAND: "python {project}/test_jinwo_vecdb.py"
        with:
          package-dir: build_python_pypi

      - name: Build source distribution
        if: github.event_name == 'release'
        run: |
          python -m pip install build
          python -m build --sdist build_python_pypi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x86_64
          path: ./wheelhouse/*

  build_linux_aarch64:
    name: Build Linux aarch64 wheels
    # 使用原生 ARM64 运行器，避免 QEMU 模拟导致的 6 小时超时
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Build & test Linux aarch64 wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS_LINUX: "aarch64"
          CIBW_TEST_COMMAND: "python {project}/test_jinwo_vecdb.py"
        with:
          package-dir: build_python_pypi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-aarch64
          path: ./wheelhouse/*

  build_macos:
    name: Build macOS wheels
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build & test macOS wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
          CIBW_ARCHS_MACOS: "x86_64 arm64 universal2"
          CIBW_TEST_COMMAND: "python {project}/test_jinwo_vecdb.py"
        with:
          package-dir: build_python_pypi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: ./wheelhouse/*

  build_windows:
    name: Build Windows wheels
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build & test Windows wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
          # x86(32位) 已移除：32位 Python 已基本淘汰，且当前 CMake 配置不对 Win32 适配
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_TEST_COMMAND: "python {project}/test_jinwo_vecdb.py"
        with:
          package-dir: build_python_pypi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: ./wheelhouse/*

  publish:
    name: Publish to PyPI
    needs: [build_linux_x86_64, build_linux_aarch64, build_macos, build_windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "dist-*"
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
