[build-system]
requires = ["setuptools>=61.0", "wheel", "cmake>=3.15"]
build-backend = "setuptools.build_meta"

[project]
name = "jinwo_vecdb"
version = "0.1.0"
description = "JinWo VecDB - 嵌入式向量数据库，零配置、零依赖、跨平台"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "灵活就业码农"}
]
keywords = ["vector", "database", "embedding", "ann", "search", "vector-db"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "black", "isort"]

[project.urls]
Homepage = "https://github.com/pkjinwo/jinwo_vector_db"
Documentation = "https://github.com/pkjinwo/jinwo_vector_db#readme"
Repository = "https://github.com/pkjinwo/jinwo_vector_db"

[tool.setuptools.packages.find]
where = ["."]
include = ["jinwo_vecdb*"]

[tool.setuptools.package-data]
jinwo_vecdb = ["*.py"]
